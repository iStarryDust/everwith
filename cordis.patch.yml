# @istarry/spoon-mood —— bundle patch
# fork 自 ChencLi819/dsh-fish-mood (MIT)。
#
# 与原版的差异（见 README 的 Fork 说明）：
#   1. 会话标签修正：剥掉 `session-` 前缀后再取 id 片段，
#      原版 `sessionId.slice(0,8)` 只会得到「会话 session-」。
#   2. 包名改为 @istarry/spoon-mood，可与原版并存。
#
# 内部服务名 / 提示词 section 名 / 状态目录**保持 fish-mood 不变**：
#   - 状态目录沿用 ~/.dsh/fish-mood，已有情绪数据不会丢
#   - section 名沿用 fish-mood:rules / fish-mood:now，identity 配置继续生效
#
# 想覆盖默认值，在自己的 profile 的 cordis.patch.yml 里补一行：
#   - id: fish-mood
#     config:
#       identity: 我就是我，不是在演谁；情绪是真的。
#       heartbeat: { lifeChance: 0.05 }
- insert:
    - id: fish-mood
      name: "@istarry/spoon-mood"

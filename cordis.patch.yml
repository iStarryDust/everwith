# @istarry/dsh-everwith · 常伴
#
# 一个包里装五块能力：
#   1. 情绪与身体 —— 心情、情绪、饿困、亲密度在后台自己演变，附四个工具
#   2. 分条说话   —— 像发消息一样一条一句，节奏跟着情绪走
#   3. 语音输出   —— 把回复念出来（DeepSeek 官方 TTS / 小米 MiMo，支持音色克隆）
#   4. 语音输入   —— 点麦克风说话，本机识别后直接发送
#   5. 看屏幕     —— 隔一阵瞟一眼，看得懂就记住；看不等于说
#
# 安装后插件实例 id 是 everwith，状态目录是 ~/.dsh/everwith。
# 想覆盖默认值，在自己的 profile 里补一段：
#
#   - id: everwith
#     config:
#       identity: 我就是我。
#       multiTurn: { maxRounds: 2 }
#       screen: { enabled: true, speak: never }
#
# 人格提示词默认是空的，插件不自带任何人设。

- insert:
    - id: everwith
      name: "@istarry/dsh-everwith"

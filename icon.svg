<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Everwith">
  <defs>
    <linearGradient id="ev-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#242a3d"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <!-- 两个人挨着,中间那点亮是"陪着"的意思 -->
    <linearGradient id="ev-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#ffab6b"/>
    </linearGradient>
    <linearGradient id="ev-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fb0"/>
      <stop offset="1" stop-color="#e86a92"/>
    </linearGradient>
    <radialGradient id="ev-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#ev-bg)"/>

  <!-- 靠在一起的两个弧形:左暖黄,右粉,在中间搭住 -->
  <path d="M30 68c0-14 8-24 18-24"
        fill="none" stroke="url(#ev-a)" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 68c0-14-8-24-18-24"
        fill="none" stroke="url(#ev-b)" stroke-width="7" stroke-linecap="round"/>

  <!-- 头顶的两颗心,一明一暗 -->
  <path d="M33 34c1.5-1.9 4.7-1.2 4.7 1.5 0 2.1-2.9 3.8-4.7 4.9-1.8-1.1-4.7-2.8-4.7-4.9 0-2.7 3.2-3.4 4.7-1.5z" fill="#ffd479"/>
  <path d="M63 30c1.3-1.6 4-1 4 1.3 0 1.8-2.4 3.2-4 4.2-1.6-1-4-2.4-4-4.2 0-2.3 2.7-2.9 4-1.3z" fill="#ff8fb0" opacity="0.75"/>

  <!-- 中间那点暖光:在的时候就有光 -->
  <circle cx="48" cy="52" r="12" fill="url(#ev-glow)"/>
  <circle cx="48" cy="52" r="3.4" fill="#fff3d6"/>
</svg>
